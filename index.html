<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>DelsuAI - Campus Guide</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- REPLACE 'YOUR_GOOGLE_MAPS_API_KEY' WITH YOUR ACTUAL KEY BELOW -->
  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAVVMrGlA7thqvSuIZyd0e9Nv8PJUqSpZE&libraries=places"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* --- THEME VARIABLES --- */
    :root {
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-ui: #e2e8f0;
    }

    body.dark-mode {
      --bg-body: #020617;
      --bg-card: #0f172a;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border-ui: #1e293b;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-body) !important;
      color: var(--text-main);
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* --- INPUT VISIBILITY --- */
    input,
    textarea {
      color: var(--text-main) !important;
      background-color: transparent;
      caret-color: #2563eb !important;
    }

    input::placeholder,
    textarea::placeholder {
      color: var(--text-muted) !important;
      opacity: 0.6;
    }

    /* --- THEME OVERRIDES --- */
    body.dark-mode .bg-white,
    body.dark-mode aside,
    body.dark-mode header {
      background-color: var(--bg-card) !important;
    }

    body.dark-mode .border-slate-100,
    body.dark-mode .border-slate-200,
    body.dark-mode .border-b,
    body.dark-mode .border-r {
      border-color: var(--border-ui) !important;
    }

    body.dark-mode .text-slate-900,
    body.dark-mode .text-slate-800 {
      color: var(--text-main) !important;
    }

    body.dark-mode .text-slate-600,
    body.dark-mode .text-slate-500 {
      color: var(--text-muted) !important;
    }

    body.dark-mode .bg-slate-50 {
      background-color: var(--bg-body) !important;
    }

    body.dark-mode .bg-slate-100 {
      background-color: #1e293b !important;
    }
  </style>
  <script type="importmap">
{

</script>

</head>

</body>

</html>
